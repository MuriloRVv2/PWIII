<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Minha Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <div class="container">
        <div class="topo">
            <h1>📚 Minha Biblioteca</h1>
            <a class="botao" th:href="@{/painel/novo}">+ Novo livro</a>
        </div>

        <table th:if="${not #lists.isEmpty(livros)}">
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Gênero</th>
                    <th>Ano</th>
                    <th>Status</th>
                    <th>Avaliação</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="livro : ${livros}">
                    <td th:text="${livro.titulo}"></td>
                    <td th:text="${livro.autor}"></td>
                    <td th:text="${livro.genero}"></td>
                    <td th:text="${livro.anoPublicacao}"></td>
                    <td>
                        <span class="badge" th:classappend="${livro.status}" th:text="${livro.status}"></span>
                    </td>
                    <td th:text="${livro.avaliacao != null ? livro.avaliacao + ' / 5' : '-'}"></td>
                    <td class="acoes">
                        <a th:href="@{/painel/editar/{id}(id=${livro.id})}">Editar</a>
                        <a th:href="@{/painel/excluir/{id}(id=${livro.id})}"
                           onclick="return confirm('Excluir este livro?');">Excluir</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <p class="vazio" th:if="${#lists.isEmpty(livros)}">
            Nenhum livro cadastrado ainda. Clique em "Novo livro" para começar.
        </p>

        <p class="rodape">
            API REST disponível em <code>/livros</code>.
        </p>
    </div>
</body>
</html>
